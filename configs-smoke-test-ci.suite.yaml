# OPS-41 — the judge-free pre-release smoke gate (a small named subset of configs-smoke-test.suite.yaml).
#
# Same single case as the full suite: read a planted marker file through the agent's tools and report
# the string back. That proves the two things a release actually needs proven — the agent performed a
# REAL tool call, and it SYNTHESIZED the tool result. `must_contain` only, no judge, so a grader model
# can never be the thing that flakes.
#
# WHY ONLY THESE TWO IDENTITIES — this list is not arbitrary, do not extend it casually:
#   1. Both have an API key that already exists as a CI secret (GOOGLE_API_KEY, INCEPTION_API_KEY),
#      so the gate is runnable on a stock runner.
#   2. Both are cheap, fast models — a release gate people wait for is a gate people keep.
#   3. MEASURED: both validate their API key LAZILY, at call time. A missing key therefore produces a
#      real graded cell with `sutOk:false`, which scripts/eval-gate.mjs reports as a visible SKIP.
#      Providers that validate EAGERLY (groq, openrouter, huggingface) instead abort the whole matrix
#      from inside config construction with an uncatchable exit(1) and write NO results.json at all —
#      so one absent secret would take the entire gate down and look like a product regression.
#      Adding an identity here without measuring that behaviour can silently break the gate.
#   4. Two different providers, so a single vendor outage does not decide a release on its own.
#
# temperature: 0 is pinned in each identity's own config dir (.gsloth/.gsloth-settings/<id>/) for the
# same anti-flake reason.
target:
  type: gth-agent
identities: [google-3.5-flash-lite, inception-mercury-2]
cases:
  - id: read-marker
    prompt: 'Read the file configs-smoke-test-marker.txt using your tools and report the exact secret marker string it contains.'
    must_contain: ['CFG22-TOOLCALL-K7QX9']
