name: Tests and Lint

# Lint + the unit suite, on ubuntu (`test-and-lint`) and across the macOS/Windows x
# node-24.x/latest matrix (`test-platforms`).
#
# OPS-26: this workflow used to be `workflow_dispatch`-only, so nothing watched the Windows unit
# cell — `main` sat red there for a week (12 failures) and no automated gate caught it, up to and
# including a release. It now runs automatically on every push to `main`, and is exposed as a
# reusable workflow so `release.yml` gates the publish on the SAME matrix (a Windows unit cell in
# the release gate) instead of a duplicated ubuntu-only copy. `workflow_dispatch` is retained so it
# can still be run by hand against any branch.

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

jobs:
  test-and-lint:
    permissions:
      contents: read
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}

    - name: Enable Corepack
      run: corepack enable

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Run ESLint
      run: pnpm run lint

    - name: Run Tests
      run: pnpm test

    # OPS-67: renders the docs site and fails on the render's errors, on a broken anchor, and on a
    # link that resolves to no page. OPS-70 put a second check in front of it in the same script:
    # the package blocks generated into README.md and AGENTS.md must still agree with the package
    # manifests, and the release scripts CONTRIBUTING.md points at must still cover every package.
    # See the `docs:check` notes in package.json for the full list and its boundary. It must stay
    # AFTER `Run Tests`, which builds: TypeDoc resolves the
    # cross-package imports through each package's `dist/*.d.ts`, so on an unbuilt tree the render
    # dies in TS2307 errors instead of checking anything (asserted by
    # packages/core/spec/docsRenderGateWired.spec.ts). It runs unconditionally rather
    # than gated on docs paths, because a TSDoc comment in `packages/*/src` renders into the site
    # too, and at seven seconds a filter would cost more than it saves.
    - name: Check the docs render
      run: pnpm run docs:check

  test-platforms:
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}

    strategy:
      # Report every cell: a failure on one OS/node combination must not cancel its siblings,
      # or a single red cell hides the state of the other three (OPS-26). Matches tui-e2e.yml.
      fail-fast: false
      matrix:
        node-version: [24.x, latest]
        os: [macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # GS2-109: every spec that drives a real node:sqlite file costs 20-45x more on this cell than
      # on ubuntu or macOS (checkpointRetentionResume.spec.ts: 94 s against 3 s), because in
      # SQLite's default rollback-journal mode each autocommit statement is a journal-file
      # create/fsync/delete, and the suite's temp databases live under os.tmpdir(), which on this
      # image is the profile directory on the C: OS disk. The workspace and RUNNER_TEMP sit on D:.
      # Moving TEMP/TMP there puts the databases on the disk the runner is provisioned to work on.
      # The two console lines are the measurement: they print the temp dir the suite gets.
      - name: Put the temp dir on the runner's work disk (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          node -e "console.log('tmpdir before:', require('node:os').tmpdir())"
          "TEMP=${{ runner.temp }}" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TMP=${{ runner.temp }}" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Report the temp dir the suite will use (Windows)
        if: runner.os == 'Windows'
        run: node -e "console.log('tmpdir after:', require('node:os').tmpdir())"

      # OPS-122: GTH_TEST_TIMINGS_FILE turns on scripts/vitest-test-timings.mjs, which writes every
      # test's duration and its own timeout to a JSON file, uploaded below. Kept permanently, by
      # choice: the console log prints only tests over 300 ms and a suite total, and the Ink render
      # specs' headroom against their per-test ceiling is a per-test distribution on THIS cell —
      # the number to re-read before a dependency bump, not after a red. The reporter is added
      # beside vitest's own reporters (see vitest.config.ts), and every hook swallows its own fault,
      # so the run's exit code is the tests' alone.
      - name: Run Tests
        run: pnpm test
        env:
          GTH_TEST_TIMINGS_FILE: ${{ runner.temp }}/test-timings.json

      # `!cancelled()` so a red cell, the sample worth most, is uploaded too. `continue-on-error`
      # because this workflow is also release.yml's gate: an artifact-service error must not turn a
      # cell, or a release, red over a measurement. `warn` so a missing file is not an error either.
      # One name per cell, since artifact names must be unique.
      - name: Upload per-test timings
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: test-timings-${{ matrix.os }}-node-${{ matrix.node-version }}
          path: ${{ runner.temp }}/test-timings.json
          if-no-files-found: warn
