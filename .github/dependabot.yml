# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: 'npm' # See documentation for possible values
    directories:
      - '/'
    schedule:
      interval: 'weekly'
    ignore:
      - dependency-name: '@types/node'
    groups:
      dev-dependencies:
        patterns:
          - '*'

  # Ungrouped on purpose: every action in .github/workflows is pinned by moving major tag, so the
  # only updates Dependabot can raise here are major bumps. Grouping those would put independent
  # breaking changes in one PR that a single red CI cell blocks entirely.
  - package-ecosystem: 'github-actions'
    directory: '/' # Dependabot scans .github/workflows itself; '/' is the repo root
    schedule:
      interval: 'weekly'
