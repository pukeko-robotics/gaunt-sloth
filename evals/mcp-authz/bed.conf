# BATCH-13 — the live multi-identity MCP authorization bed.
#
# Sourced by evals/harness/run-bed.sh, which owns the lifecycle. Everything here is what makes THIS
# bed different from its siblings. See the harness header for the settings and their defaults.

BED_NAME=AUTHZ

# The passing matrix and the run that proves it can fail. The harness refuses to start unless both
# are declared and present.
BED_REAL_SUITE=authz.suite.yaml
BED_BROKEN_SUITE=authz-broken.suite.yaml

# MUST match the URL pinned in the per-identity profile configs under workdir/.gsloth/.
BED_PORT_VAR=AUTHZ_MCP_PORT
BED_PORT_DEFAULT=39405

BED_READY_PATH=/health
BED_READY_NOUN="GET /health"
BED_READY_ATTEMPTS=50
BED_READY_INTERVAL=0.2

BED_CONCURRENCY_DEFAULT=3

# One process, no children, so a plain kill reaches all of it.
BED_SUT_PROCESS_GROUP=0

# The suites run against Anthropic and so need ANTHROPIC_API_KEY, but this bed has never failed
# early on its absence and declaring it here would change that. Left as it is on purpose: turning a
# late failure into an early one is a behaviour change, not a relocation.
BED_REQUIRED_ENV=()

# `exec` matters: the harness starts this in the background and later kills what `$!` names, so the
# SUT must REPLACE the subshell rather than run as a child of it.
bed_start_sut() {
  AUTHZ_MCP_PORT="$PORT" exec node "$BED_DIR/src/authz-mcp-server.ts"
}
