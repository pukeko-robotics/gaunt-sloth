# BATCH-17 — the live AG-UI bed: gaunt-sloth's own `gth api ag-ui` server, graded through the
# `ag-ui` eval target.
#
# Sourced by evals/harness/run-bed.sh, which owns the lifecycle. Everything here is what makes THIS
# bed different from its siblings. See the harness header for the settings and their defaults.

BED_NAME=AGUI

BED_REAL_SUITE=agui.suite.yaml
BED_BROKEN_SUITE=agui-broken.suite.yaml

# Both suites pin the matching url.
BED_PORT_VAR=AGUI_PORT
BED_PORT_DEFAULT=41757

BED_READY_PATH=/health
BED_READY_NOUN="GET /health"
BED_READY_ATTEMPTS=100
BED_READY_INTERVAL=0.3

BED_CONCURRENCY_DEFAULT=2

# The graded run is wrapped in `timeout` so a stream that opens and never finishes surfaces as a
# reportable nonzero rather than a wedged session.
BED_EVAL_TIMEOUT_DEFAULT=300
BED_TIMEOUT_HINT="A hung SSE stream is BATCH-15 gap #1: the ag-ui runner has no fetch/stream timeout."

# The express server forks, so the SUT is started under setsid and torn down by process group.
BED_SUT_PROCESS_GROUP=1
BED_SUT_LOG=agui-server.log

BED_REQUIRED_ENV=(
  "ANTHROPIC_API_KEY:the served AG-UI SUT agent (Haiku) needs it."
  "GOOGLE_API_KEY:the gth judge (gemini-flash-lite) needs it."
)

# `exec` matters: the harness starts this in the background and later kills the group `$!` leads, so
# setsid must REPLACE the subshell rather than run as a child of it.
# The global `--config` flag MUST precede the `api ag-ui` subcommand. </dev/null so the CLI never
# blocks on stdin. The SUT agent reads ANTHROPIC_API_KEY from the environment.
bed_start_sut() {
  exec setsid node "$CLI" --config "$BED_DIR/agent/.gsloth.config.json" api ag-ui --port "$PORT" \
    </dev/null >"$BED_DIR/$BED_SUT_LOG" 2>&1
}
