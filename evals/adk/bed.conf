# BATCH-16 — the live Python google-adk agent bed, graded over A2A.
#
# Sourced by evals/harness/run-bed.sh, which owns the lifecycle. Everything here is what makes THIS
# bed different from its siblings. See the harness header for the settings and their defaults.

BED_NAME=ADK

BED_REAL_SUITE=adk.suite.yaml
BED_BROKEN_SUITE=adk-broken.suite.yaml

# Both suites pin the matching url.
BED_PORT_VAR=ADK_A2A_PORT
BED_PORT_DEFAULT=41539

# The ADK Starlette app has no /health route, and its A2A routes — the card included — are attached
# in the lifespan. So a 200 on the well-known card means both "listening" and "startup ran".
BED_READY_PATH=/.well-known/agent-card.json
BED_READY_NOUN="the A2A agent card"
BED_READY_ATTEMPTS=100
BED_READY_INTERVAL=0.3

BED_CONCURRENCY_DEFAULT=2

# uvicorn forks a server child, so the SUT is started under setsid and torn down by process group.
BED_SUT_PROCESS_GROUP=1
BED_SUT_LOG=adk-agent.log

BED_REQUIRED_ENV=("GOOGLE_API_KEY:the ADK SUT and the gth judge both need it.")

# The SUT model, overridable for a repoint.
ADK_MODEL="${ADK_A2A_MODEL:-gemini-flash-lite-latest}"

VENV="$BED_DIR/.venv"

# google-adk plus the LOAD-BEARING a2a-sdk pin; see requirements.txt for why the pin matters.
# Created on the first run and reused after. SKIP_VENV=1 reuses an already-provisioned .venv.
bed_provision() {
  if [[ "${SKIP_VENV:-}" != "1" ]]; then
    if [[ ! -x "$VENV/bin/python" ]]; then
      echo "==> creating venv + installing requirements (first run) ..."
      python3 -m venv "$VENV"
      "$VENV/bin/pip" install --upgrade pip >/dev/null
      "$VENV/bin/pip" install -r "$BED_DIR/requirements.txt" >/dev/null
    fi
  fi
  if [[ ! -x "$VENV/bin/python" ]]; then
    echo "ERROR: venv python not found at $VENV/bin/python (run without SKIP_VENV=1 first)." >&2
    exit 3
  fi
}

# `exec` matters: the harness starts this in the background and later kills the group `$!` leads, so
# setsid must REPLACE the subshell rather than run as a child of it.
# GOOGLE_GENAI_USE_VERTEXAI=FALSE routes the SUT model to AI Studio (GOOGLE_API_KEY), not Vertex.
bed_start_sut() {
  ADK_A2A_PORT="$PORT" ADK_A2A_MODEL="$ADK_MODEL" GOOGLE_GENAI_USE_VERTEXAI=FALSE \
    exec setsid "$VENV/bin/python" -m uvicorn adk_agent:app \
    --host 127.0.0.1 --port "$PORT" --app-dir "$BED_DIR/src" \
    >"$BED_DIR/$BED_SUT_LOG" 2>&1
}
